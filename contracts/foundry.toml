[profile.default]
src = "src"
out = "out"
libs = ["lib", "node_modules"]
solc = "0.8.26"
evm_version = "prague"
optimizer = true
optimizer_runs = 200
via_ir = true
network = "monad"
remappings = [
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
  "forge-std/=lib/forge-std/src/",
]
fs_permissions = [{ access = "read-write", path = "../packages/shared" }]

[fuzz]
runs = 256

[invariant]
runs = 64
depth = 32

[rpc_endpoints]
monad = "${RPC_URL}"
